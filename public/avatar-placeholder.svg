<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Squircle Frame -->
  <rect x="8" y="8" width="384" height="384" rx="80" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="8" y="8" width="384" height="384" rx="80" fill="url(#grid)" />

  <!-- Geometric Subtle Rings -->
  <circle cx="200" cy="180" r="110" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />
  <circle cx="200" cy="180" r="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Monogram TM -->
  <text x="200" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">TM</text>

  <!-- Subtitle Tag -->
  <rect x="110" y="270" width="180" height="30" rx="15" fill="#090D16" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
  <text x="200" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">TALHA MASOOD</text>
</svg>
